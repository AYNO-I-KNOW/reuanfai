name: ci
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
  deploy:
    name: Deploy ${{ matrix.app }} production to Vercel
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # api first: web's /api rewrite targets the api production domain
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - app: api
            project_secret: VERCEL_API_PROJECT_ID
          - app: web
            project_secret: VERCEL_PROJECT_ID
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Verify deployment secrets
        run: |
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name/VERCEL_PROJECT_ID/${{ matrix.project_secret }}}"
              exit 1
            fi
          done
      - name: Install Vercel CLI
        run: npm install --global vercel@65.4.0
      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production artifacts
        run: |
          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "Skipped deployment: main has a newer commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" > deployment-url.txt
          printf '%s production deployment: %s\n' "${{ matrix.app }}" "$(cat deployment-url.txt)" >> "$GITHUB_STEP_SUMMARY"
